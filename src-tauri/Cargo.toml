[package]
name = "featherweight"
version = "0.1.0"
description = "Featherweight - a transparent Windows optimizer"
authors = ["Featherweight contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "featherweight_lib"
doctest = false
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "featherweight"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
include_dir = "0.7"
time = { version = "0.3", features = ["formatting", "macros"] }
regex = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
winreg = "0.56"
