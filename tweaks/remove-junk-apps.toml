id = "remove-junk-apps"
title = "Remove preinstalled junk apps"
description = "Removes games and apps that come preinstalled, like Candy Crush, Solitaire, Clipchamp and News, for every account on this PC. You can reinstall most of them from the Microsoft Store."
section = "remove"
level = "safe"
presets = ["everyday", "gaming"]
irreversible = true

# Deliberately NOT removed: Microsoft.GetHelp (Windows 11 troubleshooters open
# it) and Microsoft.MixedReality.Portal (Windows Mixed Reality headsets need it).

