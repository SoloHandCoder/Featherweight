id = "disable-telemetry-tasks"
title = "Turn off diagnostic data tasks"
description = "Turns off scheduled tasks that collect usage and app compatibility data in the background. Your apps keep working and Windows feature updates still install."
section = "background"
level = "safe"
presets = ["everyday", "gaming"]

# A task missing on this PC is skipped; the tweak is "not on this PC" only if
# none of them exist. Newer Windows 11 builds renamed the Appraiser task to
# "Microsoft Compatibility Appraiser Exp", so both names are listed.

[[actions]]
type = "scheduled_task"
path = '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator'
enabled = false

[[actions]]
type = "scheduled_task"
path = '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip'
enabled = false

[[actions]]
type = "scheduled_task"
path = '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser'
enabled = false

[[actions]]
type = "scheduled_task"
path = '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser Exp'
enabled = false
