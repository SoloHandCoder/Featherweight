id = "disable-widgets"
title = "Turn off Widgets and News"
description = "Removes the Widgets and news feed from the taskbar. Nothing else on the taskbar changes."
section = "remove"
level = "safe"
presets = ["everyday", "gaming"]
# Windows 11 only. The Windows 10 equivalent is disable-news-and-interests;
# Windows 11 refuses writes to the Windows 10 "Windows Feeds" policy key.
min_build = 22000

# Group Policy "Allow widgets".
[[actions]]
type = "registry"
hive = "hklm"
path = 'SOFTWARE\Policies\Microsoft\Dsh'
name = "AllowNewsAndInterests"
value = { dword = 0 }
