id = "remove-xbox-apps"
title = "Remove Xbox apps"
description = "Removes the Xbox app and Xbox Console Companion. Skip this if you use Game Pass or the Xbox app to launch games."
section = "remove"
level = "advanced"
irreversible = true

# Deliberately NOT removed: Microsoft.XboxIdentityProvider and
# Microsoft.Xbox.TCUI (many PC games need them to sign in to Xbox services),
# Microsoft.XboxGamingOverlay / Microsoft.XboxGameOverlay (Game Bar; removing
# it makes Windows pop up "you'll need a new app" errors), and
# Microsoft.GamingServices.

# The current Xbox app (Windows 11, and newer Windows 10 installs).
[[actions]]
type = "appx"
package = "Microsoft.GamingApp"
all_users = "optional"
reinstall = "9MV0B5HZVK9Z"

# Xbox Console Companion (older Windows 10 installs).
[[actions]]
type = "appx"
package = "Microsoft.XboxApp"
all_users = "optional"
reinstall = "9WZDNCRFJBD8"
