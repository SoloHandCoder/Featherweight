<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Featherweight logo</title>
<style>
body{margin:0;background:#0f1115;color:#e6e8ee;font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;padding:28px 16px}
h1{font:600 22px "Segoe UI Variable Display","Segoe UI",system-ui;margin:0 0 4px}
h2{font:600 15px "Segoe UI Variable Display","Segoe UI",system-ui;margin:22px 0 8px;color:#a5b4fc}
.sub{color:#8b91a1;margin:0 0 8px}
.wrap{max-width:1240px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.row{display:flex;align-items:flex-end;gap:28px;padding:18px;border-radius:10px;margin-bottom:8px;overflow:hidden}
.dark{background:#0f1115;border:1px solid #262a33}.light{background:#fff;color:#0f1115}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
figure svg{display:block}figcaption{font-size:11px;color:#8b91a1}
.taskbar{display:flex;align-items:center;gap:4px;height:48px;padding:0 10px;border-radius:8px;margin:8px 0;justify-content:center;position:relative}
.tb{width:40px;height:40px;border-radius:4px;display:grid;place-items:center;position:relative}
.tb.active{background:#80808022}
.tb.active::after{content:"";position:absolute;bottom:2px;width:16px;height:3px;border-radius:2px;background:#60cdff}
.win{width:20px;height:20px;background:linear-gradient(#60cdff,#3b8ee8);clip-path:polygon(0 0,46% 0,46% 46%,0 46%,0 54%,46% 54%,46% 100%,0 100%,0 0,54% 0,100% 0,100% 46%,54% 46%,54% 54%,100% 54%,100% 100%,54% 100%,54% 54%,46% 54%)}
.ghost{width:22px;height:22px;border-radius:5px;background:#8888}
.clock{position:absolute;right:12px;font-size:12px}
.hdr{padding:20px;border-radius:10px;margin-bottom:8px}.hdr img{max-width:100%;height:auto;display:block}
.social img{width:100%;max-width:1280px;border-radius:10px;display:block;border:1px solid #262a33}
</style></head><body><div class="wrap">
<h1>Featherweight: final mark (option B, refined)</h1>
