name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $appVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match tauri.conf.json version $appVersion"
          }
          Write-Host "Tag $env:GITHUB_REF_NAME matches version $appVersion"

      - name: Build
        run: npm run tauri build

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          Copy-Item $installers[0].FullName dist-release/
          Copy-Item src-tauri/target/release/featherweight.exe dist-release/featherweight-portable.exe
          Get-ChildItem dist-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
