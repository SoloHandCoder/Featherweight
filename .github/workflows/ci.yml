name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --include-ignored
      - run: npm run tauri build
      - name: Collect build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-app | Out-Null
          Copy-Item src-tauri/target/release/featherweight.exe dist-app/featherweight-portable.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe dist-app/
      - uses: actions/upload-artifact@v4
        with:
          name: featherweight-windows-x64
          path: dist-app/
          if-no-files-found: error
